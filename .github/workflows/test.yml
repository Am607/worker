name: Check Oracle Server

on:
  workflow_dispatch:

jobs:
  check-server:
    runs-on: ubuntu-latest

    steps:
      - name: Connect and inspect server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}

          script: |
            echo "================================"
            echo " SERVER INFORMATION"
            echo "================================"

            echo ""
            echo "Current user:"
            echo "$(whoami)00"

            echo ""
            echo "Hostname:"
            hostname

            echo ""
            echo "Operating system:"
            cat /etc/os-release | head -n 3

            echo ""
            echo "Local IP addresses:"
            hostname -I

            echo ""
            PUBLIC_IP=$(curl -4 -s https://api.ipify.org)
            echo "Public IP: ${PUBLIC_IP}00"

            echo ""
            echo "Home directory:"
            echo "$HOME"

            echo ""
            echo "SSH directory:"
            ls -la ~/.ssh 2>/dev/null || echo "No .ssh directory"

            echo ""
            echo "================================"
            echo " Connection successful"
            echo "================================"

      - name: Verify Oracle secrets
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          echo "Checking secrets..."

          [ -n "$ORACLE_HOST" ] && echo "✅ ORACLE_HOST is set" || echo "❌ ORACLE_HOST is empty"
          [ -n "$ORACLE_USER" ] && echo "✅ ORACLE_USER is set" || echo "❌ ORACLE_USER is empty"
          [ -n "$ORACLE_SSH_KEY" ] && echo "✅ ORACLE_SSH_KEY is set" || echo "❌ ORACLE_SSH_KEY is empty"
