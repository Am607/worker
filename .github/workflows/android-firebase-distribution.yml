name: Android Firebase App Distribution

on:
  workflow_dispatch:
    inputs:
      caller_repo:
        description: Private Flutter repository to build
        required: true
        type: string
      caller_ref:
        description: Branch or ref to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Flutter app
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.caller_repo }}
          ref: ${{ inputs.caller_ref }}
          token: ${{ secrets.FLUTTER_PRIVATE_REPO_PAT }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@v1.0.9
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          domain: https://app.infisical.com
          project-slug: "soai"
          env-slug: "prod"
          secret-path: "/flutter"
          export-type: env
      

      - name: Create Flutter .env from Infisical
        shell: bash
        run: |
          : "${BASE_URL:?BASE_URL missing from Infisical}"
      
          printf 'BASE_URL=%s\n' "$BASE_URL" > .env
      
          echo "Flutter .env created successfully"
          test -s .env

      - name: Configure Android release signing
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_UPLOAD_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_UPLOAD_KEY_PASSWORD
          keyAlias=$ANDROID_UPLOAD_KEY_ALIAS
          storeFile=$RUNNER_TEMP/upload-keystore.jks
          EOF

      - name: Build signed release APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Upload APK to Firebase App Distribution
        env:
          FIREBASE_APP_ID: 1:776978188107:android:28d4d83f0619f0e656cace
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npx --yes firebase-tools appdistribution:distribute \
            build/app/outputs/flutter-apk/app-release.apk \
            --app "$FIREBASE_APP_ID" \
            --groups "qa" \
            --token "$FIREBASE_TOKEN"
