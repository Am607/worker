
name: lms-prod-deploy

on:
  repository_dispatch:
    types: [lms-deploy-prod]

concurrency:
  group: lms-prod-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/am607/lms_go_prod
  PRIVATE_REPO: ${{ github.event.client_payload.repository }}
  SHA: ${{ github.event.client_payload.sha }}
  PR_NUMBER: ${{ github.event.client_payload.pr_number }}

jobs:
  # -----------------------------------------
  # 1. VALIDATE PAYLOAD
  # -----------------------------------------
  validate-payload:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate deployment payload
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$PRIVATE_REPO" != "Am607/lms_go" ]]; then
            echo "Invalid repository: $PRIVATE_REPO"
            exit 1
          fi

          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid commit SHA"
            exit 1
          fi

          if [[ -n "$PR_NUMBER" && ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Invalid PR number"
            exit 1
          fi

          echo "Payload validated successfully"

  # -----------------------------------------
  # 2. BUILD AND PUSH DOCKER IMAGE
  # -----------------------------------------
  build-and-push-image:
    needs: validate-payload
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref: ${{ env.SHA }}
          token: ${{ secrets.LMS_PRIVATE_REPO_PAT }}
          fetch-depth: 1

      - name: Verify commit
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)

          if [ "$actual" != "$SHA" ]; then
            echo "Commit mismatch"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ env.SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -----------------------------------------
  # 3. COPY COMPOSE FILE TO ORACLE
  # -----------------------------------------
  ship-compose-file:
    needs: build-and-push-image
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref: ${{ env.SHA }}
          token: ${{ secrets.LMS_PRIVATE_REPO_PAT }}
          fetch-depth: 1

      - name: Verify production compose file
        run: |
          set -euo pipefail

          ls -la

          if [ ! -f docker-compose.yml ]; then
            echo "docker-compose.yml not found!"
            exit 1
          fi

          echo "Compose file verified"

      - name: Copy compose file to Oracle VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_ORACLE_HOST }}
          username: ${{ secrets.PROD_ORACLE_USER }}
          key: ${{ secrets.PROD_ORACLE_SSH_KEY }}
          port: 22
          source: "docker-compose.yml"
          target: "/opt/lms_go/"
          overwrite: true

  # -----------------------------------------
  # 4. DEPLOY ON ORACLE VPS
  # -----------------------------------------
  deploy-to-vps:
    needs: ship-compose-file
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy LMS to Oracle
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_ORACLE_HOST }}
          username: ${{ secrets.PROD_ORACLE_USER }}
          key: ${{ secrets.PROD_ORACLE_SSH_KEY }}
          port: ${{ secrets.PROD_ORACLE_SSH_PORT || 22 }}
          command_timeout: 18m
          envs: IMAGE,SHA,INFISICAL_CLIENT_ID,INFISICAL_CLIENT_SECRET,LMS_INFISICAL_PROJECT_ID,INFISICAL_ENV_SLUG,GHCR_USER,GHCR_PAT

          script: |
            bash -se <<'BASH'
            set -euo pipefail
            umask 077

            cd /opt/lms_go

            RELEASE_IMAGE="${IMAGE}:${SHA}"
            COMPOSE_FILE="docker-compose.yml"

            echo "========== PRODUCTION DEPLOYMENT =========="
            echo "Deploying: ${RELEASE_IMAGE}"

            # ----------------------------------
            # INFISICAL AUTHENTICATION
            # ----------------------------------
            echo "== Authenticating with Infisical =="

            TOKEN_FILE=$(mktemp)
            trap 'rm -f "$TOKEN_FILE"' EXIT

            infisical login \
              --method=universal-auth \
              --client-id="${INFISICAL_CLIENT_ID}" \
              --client-secret="${INFISICAL_CLIENT_SECRET}" \
              --silent --plain > "$TOKEN_FILE"

            INFISICAL_TOKEN=$(cat "$TOKEN_FILE")

            # ----------------------------------
            # FETCH PRODUCTION ENVIRONMENT
            # ----------------------------------
            echo "== Fetching production environment =="

            infisical export \
              --projectId="${LMS_INFISICAL_PROJECT_ID}" \
              --env="${INFISICAL_ENV_SLUG}" \
              --path="/lms_go" \
              --format=dotenv \
              --token="${INFISICAL_TOKEN}" > .env.tmp

            test -s .env.tmp
            mv .env.tmp .env
            chmod 600 .env

            rm -f "$TOKEN_FILE"
            trap - EXIT
            unset INFISICAL_TOKEN
            unset INFISICAL_CLIENT_SECRET

            # ----------------------------------
            # GHCR AUTHENTICATION
            # ----------------------------------
            echo "== Logging into GHCR =="

            echo "${GHCR_PAT}" | docker login ghcr.io \
              -u "${GHCR_USER}" \
              --password-stdin

            # ----------------------------------
            # PULL NEW IMAGE
            # ----------------------------------
            echo "== Pulling production image =="

            docker pull "$RELEASE_IMAGE"

            # ----------------------------------
            # VERIFY COMPOSE CONFIGURATION
            # ----------------------------------
            echo "== Checking compose configuration =="

            IMAGE="$RELEASE_IMAGE" \
              docker compose -f "$COMPOSE_FILE" config -q

            # ----------------------------------
            # SAVE PREVIOUS IMAGE
            # ----------------------------------
            echo "== Saving previous image =="

            OLD_CONTAINER=$(
              IMAGE="$RELEASE_IMAGE" \
              docker compose -f "$COMPOSE_FILE" ps -q api
            )

            PREVIOUS_IMAGE=""

            if [ -n "$OLD_CONTAINER" ]; then
              PREVIOUS_IMAGE=$(
                docker inspect \
                  --format='{{.Config.Image}}' \
                  "$OLD_CONTAINER"
              )
            fi

            echo "$PREVIOUS_IMAGE" > .last_image

            # ----------------------------------
            # START DATABASE AND REDIS
            # ----------------------------------
            echo "== Starting database and Redis =="

            IMAGE="$RELEASE_IMAGE" \
              docker compose -f "$COMPOSE_FILE" up -d \
              --no-build db redis

            # ----------------------------------
            # WAIT FOR DEPENDENCIES
            # ----------------------------------
            echo "== Waiting for healthy services =="

            for service in db redis; do
              READY=0

              for i in $(seq 1 30); do
                CONTAINER=$(
                  IMAGE="$RELEASE_IMAGE" \
                  docker compose -f "$COMPOSE_FILE" \
                    ps -q "$service"
                )

                if [ -n "$CONTAINER" ]; then
                  STATUS=$(
                    docker inspect \
                      --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' \
                      "$CONTAINER"
                  )

                  if [ "$STATUS" = "healthy" ]; then
                    READY=1
                    break
                  fi
                fi

                sleep 2
              done

              if [ "$READY" -ne 1 ]; then
                echo "$service did not become healthy"
                exit 1
              fi

              echo "$service is healthy"
            done

            # ----------------------------------
            # RUN DATABASE MIGRATIONS
            # ----------------------------------
            echo "== Running database migrations =="

            set -a
            . ./.env
            set +a

            MIGRATION_DB_URL="postgres://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=disable"

            unset DB_PASSWORD

            IMAGE="$RELEASE_IMAGE" \
              docker compose -f "$COMPOSE_FILE" run \
              --rm \
              --no-deps \
              --entrypoint migrate \
              api \
              -path=/app/migrations \
              -database "$MIGRATION_DB_URL" \
              up

            unset MIGRATION_DB_URL

            echo "== Migrations completed =="

            # ----------------------------------
            # START NEW API
            # ----------------------------------
            echo "== Starting new API container =="

            if ! IMAGE="$RELEASE_IMAGE" \
              docker compose -f "$COMPOSE_FILE" up \
                -d --no-deps --no-build \
                --force-recreate api; then
              echo "API startup failed"
              DEPLOY_FAILED=1
            else
              DEPLOY_FAILED=0
            fi

            # ----------------------------------
            # VERIFY DEPLOYED IMAGE AND HEALTH
            # ----------------------------------
            if [ "$DEPLOY_FAILED" -eq 0 ]; then
              echo "== Verifying deployed image =="

              API_CONTAINER=$(
                IMAGE="$RELEASE_IMAGE" \
                docker compose -f "$COMPOSE_FILE" ps -q api
              )

              if [ -z "$API_CONTAINER" ]; then
                DEPLOY_FAILED=1
              else
                RUNNING_IMAGE=$(
                  docker inspect \
                    --format='{{.Config.Image}}' \
                    "$API_CONTAINER"
                )

                if [ "$RUNNING_IMAGE" != "$RELEASE_IMAGE" ]; then
                  echo "Running image mismatch"
                  DEPLOY_FAILED=1
                fi
              fi
            fi

            if [ "$DEPLOY_FAILED" -eq 0 ]; then
              echo "== Checking API health =="

              HEALTHY=0

              for i in $(seq 1 30); do
                if curl -fsS \
                  http://localhost:8006/api/v1/health \
                  > /dev/null; then

                  HEALTHY=1
                  break
                fi

                sleep 2
              done

              if [ "$HEALTHY" -ne 1 ]; then
                DEPLOY_FAILED=1
              fi
            fi

            # ----------------------------------
            # ROLLBACK ON FAILURE
            # ----------------------------------
            if [ "$DEPLOY_FAILED" -ne 0 ]; then
              echo "== Deployment failed =="

              if [ -n "$PREVIOUS_IMAGE" ]; then
                echo "== Rolling back API image =="

                IMAGE="$PREVIOUS_IMAGE" \
                  docker compose -f "$COMPOSE_FILE" up \
                  -d --no-deps --no-build \
                  --force-recreate api

                echo "Previous API image restored"
              else
                echo "No previous image available"
              fi

              exit 1
            fi

            # ----------------------------------
            # CLEANUP
            # ----------------------------------
            echo "== Cleaning unused Docker images =="

            docker image prune -f

            echo "========== DEPLOYMENT SUCCESSFUL =========="
            BASH

        env:
          IMAGE: ${{ env.IMAGE }}
          SHA: ${{ env.SHA }}
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          LMS_INFISICAL_PROJECT_ID: ${{ secrets.LMS_INFISICAL_PROJECT_ID }}
          INFISICAL_ENV_SLUG: prod
          GHCR_USER: ${{ github.actor }}
          GHCR_PAT: ${{ secrets.GITHUB_TOKEN }}

  # -----------------------------------------
  # 5. NOTIFY PR
  # -----------------------------------------
  notify-pr:
    needs:
      - validate-payload
      - build-and-push-image
      - ship-compose-file
      - deploy-to-vps

    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Notify successful deployment
        if: needs.deploy-to-vps.result == 'success' && env.PR_NUMBER != ''
        run: |
          set -euo pipefail

          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.LMS_PRIVATE_REPO_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${PRIVATE_REPO}/issues/${PR_NUMBER}/comments" \
            -d "$(jq -cn \
              --arg sha "$SHA" \
              --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              '{body: ("✅ Production deploy succeeded for `" + $sha + "`\n\n" + $run)}')"

      - name: Notify failed deployment
        if: needs.deploy-to-vps.result != 'success' && env.PR_NUMBER != ''
        run: |
          set -euo pipefail

          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.LMS_PRIVATE_REPO_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${PRIVATE_REPO}/issues/${PR_NUMBER}/comments" \
            -d "$(jq -cn \
              --arg sha "$SHA" \
              --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              '{body: ("❌ Production deploy failed for `" + $sha + "`\n\n" + $run)}')"
