
name: Universal Docker Deploy

on:
  repository_dispatch:
    types: [deploy-prod, deploy-staging]

permissions:
  contents: read
  id-token: write

concurrency:
  group: universal-${{ github.event.client_payload.repository }}-${{ github.event.client_payload.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy approved Docker project
    runs-on: ubuntu-latest
    environment: ${{ github.event.client_payload.environment == 'staging' && 'staging' || 'production' }}
    timeout-minutes: 45

    steps:
      # -----------------------------------------
      # 1. CHECKOUT CENTRAL REPOSITORY
      # -----------------------------------------
      - name: Checkout central deployment repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # -----------------------------------------
      # 2. VALIDATE DEPLOYMENT PAYLOAD
      # -----------------------------------------
      - name: Validate payload against central allowlist
        id: cfg
        shell: bash
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          DISPATCH_TYPE: ${{ github.event.action }}
        run: |
          set -euo pipefail

          echo "$PAYLOAD" | jq -e 'type == "object"' >/dev/null

          repo=$(jq -er '.repository | select(type == "string")' <<< "$PAYLOAD")
          sha=$(jq -er '.sha | select(type == "string")' <<< "$PAYLOAD")
          supplied_project=$(jq -er '.project_slug | select(type == "string")' <<< "$PAYLOAD")
          supplied_env=$(jq -er '.environment | select(type == "string")' <<< "$PAYLOAD")
          supplied_secret_path=$(jq -er '.secret_path | select(type == "string")' <<< "$PAYLOAD")
          supplied_deploy_path=$(jq -er '.deploy_path | select(type == "string")' <<< "$PAYLOAD")
          health=$(jq -er '.health_url | select(type == "string")' <<< "$PAYLOAD")
          pr_number=$(jq -er '.pr_number | select(type == "number" and . > 0 and . % 1 == 0)' <<< "$PAYLOAD")

          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Invalid commit SHA"
            exit 1
          }

          # Keep the source repository allowlist and application layout here;
          # environment-specific deploy values come from the dispatch payload.
          case "$repo" in
            Am607/qissaplay-backend)
              image=ghcr.io/am607/video_stories
              branch=main
              compose=docker-compose.yml
              path="$supplied_deploy_path"
              project=video_stories
              app=server
              dependencies=db
              ;;
            *)
              echo "Repository is not approved: $repo"
              exit 1
              ;;
          esac

          case "$DISPATCH_TYPE:$supplied_env" in
            deploy-prod:prod)
              project=video_stories
              ;;
            deploy-staging:staging)
              project=video_stories_staging
              ;;
            *) echo "Dispatch event and environment do not match"; exit 1 ;;
          esac
          [[ "$supplied_project" =~ ^[A-Za-z0-9_-]+$ ]] || {
            echo "Invalid Infisical project slug"
            exit 1
          }
          [[ "$supplied_secret_path" =~ ^/[A-Za-z0-9_/-]*$ ]] || {
            echo "Invalid Infisical secret path"
            exit 1
          }
          [[ "$path" =~ ^/opt/[A-Za-z0-9_.-]+$ ]] || {
            echo "Invalid deployment path"
            exit 1
          }
          health_pattern='^http://127\.0\.0\.1:[0-9]+/[A-Za-z0-9_./?=&%-]*$'
          [[ "$health" =~ $health_pattern ]] || {
            echo "Health URL must use loopback HTTP"
            exit 1
          }

          {
            echo "repo=$repo"
            echo "sha=$sha"
            echo "pr_number=$pr_number"
            echo "environment=$supplied_env"
            echo "image=$image"
            echo "branch=$branch"
            echo "compose=$compose"
            echo "deploy_path=$path"
            echo "project=$project"
            echo "app=$app"
            echo "health=$health"
            echo "dependencies=$dependencies"
            echo "infisical_project=$supplied_project"
            echo "infisical_env=$supplied_env"
            echo "infisical_path=$supplied_secret_path"
          } >> "$GITHUB_OUTPUT"

      # -----------------------------------------
      # 3. FETCH INFISICAL SECRETS USING OIDC
      # -----------------------------------------
      - name: Verify Infisical identity is configured
        shell: bash
        env:
          IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID }}
        run: |
          test -n "$IDENTITY_ID" || {
            echo "Set the INFISICAL_IDENTITY_ID repository variable"
            exit 1
          }

      # Fetch deployment credentials
      - name: Fetch deployment secrets
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.DEPLOY_INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ steps.cfg.outputs.infisical_env }}
          secret-path: /
          recursive: false
          export-type: env

      # Export application secrets directly to .env
      - name: Export application secrets
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ steps.cfg.outputs.infisical_project }}
          env-slug: ${{ steps.cfg.outputs.infisical_env }}
          secret-path: ${{ steps.cfg.outputs.infisical_path }}
          recursive: false
          export-type: file
          file-output-path: /app.env


      # -----------------------------------------
      # 4. VALIDATE FETCHED SECRETS
      # -----------------------------------------
      - name: Verify required Infisical secrets
        shell: bash
        run: |
          set -euo pipefail

          for name in \
            REPO_READ_PAT \
            GHCR_USERNAME \
            GHCR_PAT \
            SERVER_HOST \
            SERVER_USER \
            SERVER_SSH_PRIVATE_KEY \
            SSH_KNOWN_HOSTS; do

            [[ -n "${!name:-}" ]] || {
              echo "Missing Infisical secret: $name"
              exit 1
            }
          done

          [[ "${SERVER_PORT:-22}" =~ ^[0-9]{1,5}$ ]] || exit 1

      # -----------------------------------------
      # 5. CHECKOUT PRIVATE PROJECT
      # -----------------------------------------
      - name: Checkout approved private source at exact commit
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.cfg.outputs.repo }}
          ref: ${{ steps.cfg.outputs.sha }}
          token: ${{ env.REPO_READ_PAT }}
          persist-credentials: false
          fetch-depth: 0
          path: source

      # -----------------------------------------
      # 6. VERIFY COMMIT
      # -----------------------------------------
      - name: Verify commit is in approved deployment branch
        shell: bash
        env:
          SHA: ${{ steps.cfg.outputs.sha }}
          BRANCH: ${{ steps.cfg.outputs.branch }}
          PR_NUMBER: ${{ steps.cfg.outputs.pr_number }}
          DEPLOY_ENV: ${{ steps.cfg.outputs.environment }}
          APPROVED_REPO: ${{ steps.cfg.outputs.repo }}
          GH_TOKEN: ${{ env.REPO_READ_PAT }}
        run: |
          set -euo pipefail

          pr=$(gh api "repos/$APPROVED_REPO/pulls/$PR_NUMBER")
          [[ $(jq -r '.base.ref' <<< "$pr") == "$BRANCH" ]] || {
            echo "Deployment PR does not target the approved branch"
            exit 1
          }

          cd source

          test "$(git rev-parse HEAD)" = "$SHA"

          if [[ "$DEPLOY_ENV" == prod ]]; then
            if [[ $(jq -r '.merged' <<< "$pr") == true ]]; then
              [[ $(jq -r '.merge_commit_sha' <<< "$pr") == "$SHA" ]]
              git merge-base --is-ancestor \
                "$SHA" "refs/remotes/origin/${BRANCH}" || {
                echo "Production commit is not on the approved branch"
                exit 1
              }
            else
              [[ $(jq -r '.state' <<< "$pr") == open ]]
              [[ $(jq -r '.head.repo.full_name' <<< "$pr") == "$APPROVED_REPO" ]]
              [[ $(jq -r '.head.sha' <<< "$pr") == "$SHA" ]] || {
                echo "Production commit is no longer the PR head"
                exit 1
              }
            fi
          else
            [[ $(jq -r '.state' <<< "$pr") == open ]]
            [[ $(jq -r '.head.repo.full_name' <<< "$pr") == "$APPROVED_REPO" ]]
            [[ $(jq -r '.head.sha' <<< "$pr") == "$SHA" ]] || {
              echo "Staging commit is no longer the PR head"
              exit 1
            }
          fi

      # -----------------------------------------
      # 7. VERIFY DOCKER FILES
      # -----------------------------------------
      - name: Confirm Docker inputs exist
        shell: bash
        env:
          COMPOSE_FILE: ${{ steps.cfg.outputs.compose }}
        run: |
          set -euo pipefail

          test -f source/Dockerfile
          test -f "source/$COMPOSE_FILE"

      # -----------------------------------------
      # 8. SETUP DOCKER BUILDX
      # -----------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -----------------------------------------
      # 9. LOGIN TO GHCR
      # -----------------------------------------
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ env.GHCR_USERNAME }}
          password: ${{ env.GHCR_PAT }}

      # -----------------------------------------
      # 10. BUILD AND PUSH IMAGE
      # -----------------------------------------
      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: ./source
          file: ./source/Dockerfile
          push: true
          tags: ${{ steps.cfg.outputs.image }}:${{ steps.cfg.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -----------------------------------------
      # 11. DEPLOY TO SERVER
      # -----------------------------------------
      - name: Secure SSH setup and deploy to server
        shell: bash
        env:
          IMAGE: ${{ steps.cfg.outputs.image }}:${{ steps.cfg.outputs.sha }}
          DEPLOY_PATH: ${{ steps.cfg.outputs.deploy_path }}
          COMPOSE_FILE: ${{ steps.cfg.outputs.compose }}
          PROJECT: ${{ steps.cfg.outputs.project }}
          APP: ${{ steps.cfg.outputs.app }}
          DEPENDENCIES: ${{ steps.cfg.outputs.dependencies }}
          HEALTH_URL: ${{ steps.cfg.outputs.health }}
        run: |
          set -euo pipefail
          umask 077

          temp=$(mktemp -d)
          trap 'rm -rf "$temp"' EXIT

          printf '%s\n' "$SERVER_SSH_PRIVATE_KEY" > "$temp/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$temp/known_hosts"

          # Copy the .env generated by Infisical
          test -s "$GITHUB_WORKSPACE/app.env" || {
            echo "Application .env file not found or empty"
            exit 1
          }

          cp "$GITHUB_WORKSPACE/app.env" "$temp/.env"
          chmod 600 "$temp/.env"

          echo "Application .env prepared successfully"

          chmod 600 "$temp"/*

          port="${SERVER_PORT:-22}"

          ssh_opts=(
            -i "$temp/id_ed25519"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$temp/known_hosts"
            -p "$port"
          )

          scp_opts=(
            -i "$temp/id_ed25519"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$temp/known_hosts"
            -P "$port"
          )

          [[ "$SERVER_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$SERVER_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          [[ "$GHCR_USERNAME" =~ ^[a-zA-Z0-9_.-]+$ ]]

          target="${SERVER_USER}@${SERVER_HOST}"
          staging="/tmp/deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          ssh "${ssh_opts[@]}" "$target" \
            "umask 077; mkdir -m 700 -p '$staging'"

          cleanup() {
            ssh "${ssh_opts[@]}" "$target" \
              "rm -rf '$staging'" || true
          }

          trap 'cleanup; rm -rf "$temp"' EXIT

          scp "${scp_opts[@]}" \
            "source/$COMPOSE_FILE" \
            "$target:$staging/docker-compose.yml"

          scp "${scp_opts[@]}" \
            "$temp/.env" \
            "$target:$staging/.env"

          # Authenticate Docker on remote server
          printf '%s' "$GHCR_PAT" | \
            ssh "${ssh_opts[@]}" "$target" \
              "docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin"

          # Pass approved deployment settings
          printf -v quoted_args ' %q' \
            "$DEPLOY_PATH" \
            "$PROJECT" \
            "$APP" \
            "$DEPENDENCIES" \
            "$HEALTH_URL" \
            "$IMAGE" \
            "$staging"

          # Deploy with the approved image and project configuration.
          ssh "${ssh_opts[@]}" "$target" \
            "bash -s --${quoted_args}" <<'REMOTE'
          set -Eeuo pipefail
          umask 077

          deploy_path=$1
          project=$2
          app=$3
          dependencies=$4
          health_url=$5
          image=$6
          staging=$7

          mkdir -p "$deploy_path"
          cd "$deploy_path"

          backup=$(mktemp -d "$deploy_path/.deploy-backup.XXXXXX")
          old_env_file=.env
          if [ ! -f .env ] && [ -f .env.prod ]; then
            old_env_file=.env.prod
          fi

          for file in docker-compose.yml .env .env.prod; do
            if [ -f "$file" ]; then
              mkdir -p "$backup/$(dirname "$file")"
              cp -p "$file" "$backup/$file"
            fi
          done

          compose=(docker compose --env-file .env -p "$project" -f docker-compose.yml)
          previous_image=""
          old_container=$(docker ps \
            --filter "label=com.docker.compose.project=$project" \
            --filter "label=com.docker.compose.service=$app" \
            --format '{{.ID}}' | head -n 1)
          if [ -n "$old_container" ]; then
            previous_image=$(docker inspect --format='{{.Config.Image}}' "$old_container")
          fi

          rollback() {
            status=$?
            trap - ERR
            echo "Deployment failed; restoring previous configuration"
            for file in docker-compose.yml .env .env.prod; do
              if [ -f "$backup/$file" ]; then
                cp -p "$backup/$file" "$file"
              fi
            done
            if [ ! -f "$backup/.env" ]; then
              rm -f .env
            fi
            if [ -n "$previous_image" ]; then
              export IMAGE="$previous_image"
              if [ "$old_env_file" = .env.prod ]; then
                unset APP_ENV_FILE
                compose=(docker compose --env-file .env.prod -p "$project" -f docker-compose.yml)
              fi
              "${compose[@]}" up -d --no-build --no-deps --force-recreate "$app" || true
            fi
            rm -r "$backup"
            exit "$status"
          }
          trap rollback ERR

          cp "$staging/docker-compose.yml" docker-compose.yml
          cp "$staging/.env" .env
          chmod 600 .env

          export IMAGE="$image"
          export APP_ENV_FILE=.env
          "${compose[@]}" config -q
          "${compose[@]}" pull "$app"

          IFS=, read -r -a dependency_services <<< "$dependencies"
          if [ "${#dependency_services[@]}" -gt 0 ]; then
            "${compose[@]}" up -d --no-build "${dependency_services[@]}"
            for service in "${dependency_services[@]}"; do
              ready=0
              for i in $(seq 1 30); do
                container=$("${compose[@]}" ps -q "$service")
                if [ -n "$container" ]; then
                  state=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' "$container")
                  if [ "$state" = healthy ]; then
                    ready=1
                    break
                  fi
                fi
                sleep 2
              done
              if [ "$ready" -ne 1 ]; then
                echo "$service did not become healthy"
                false
              fi
            done
          fi

          "${compose[@]}" up -d --no-build --no-deps --force-recreate "$app"
          app_container=$("${compose[@]}" ps -q "$app")
          test -n "$app_container"
          test "$(docker inspect --format='{{.Config.Image}}' "$app_container")" = "$image"

          ready=0
          for i in $(seq 1 30); do
            state=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' "$app_container")
            if [ "$state" = healthy ]; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "$app did not become healthy"
            false
          fi

          ready=0
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error "$health_url" >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "Health URL did not become ready: $health_url"
            false
          fi

          trap - ERR
          rm -r "$backup"
          echo "Deployment healthy: $image"
          REMOTE

      # -----------------------------------------
      # 12. DEPLOYMENT SUMMARY
      # -----------------------------------------
      - name: Job summary
        if: success()
        shell: bash
        env:
          REPO: ${{ steps.cfg.outputs.repo }}
          SHA: ${{ steps.cfg.outputs.sha }}
        run: |
          printf '### Deployed %s\n\nCommit: `%s`\n' \
            "$REPO" "$SHA" >> "$GITHUB_STEP_SUMMARY"

      # -----------------------------------------
      # 13. NOTIFY SOURCE PR
      # -----------------------------------------
      - name: Notify source PR (optional)
        if: always() && steps.cfg.outcome == 'success' && env.REPO_READ_PAT != ''
        shell: bash
        env:
          GH_TOKEN: ${{ env.REPO_READ_PAT }}
          PR: ${{ github.event.client_payload.pr_number }}
          REPO: ${{ steps.cfg.outputs.repo }}
          RESULT: ${{ job.status }}
        run: |
          set -euo pipefail

          [[ "$PR" =~ ^[0-9]+$ ]] || exit 0

          case "$RESULT" in
            success)
              label='✅ Deployment succeeded'
              ;;
            *)
              label='❌ Deployment failed'
              ;;
          esac

          body="${label}: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          gh api "repos/$REPO/issues/$PR/comments" \
            -f body="$body"
